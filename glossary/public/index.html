<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="낯선 개발 용어를 정의, 예시, 사용 상황, 작동 방식으로 풀어보는 개인 용어 노트" />
    <title>개발어 번역소</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="개발어 번역소 홈">
        <span class="brand-mark">{ }</span>
        <span>개발어 번역소</span>
      </a>
      <p class="header-note">모르면, 풀어서 보면 된다.</p>
    </header>

    <main>
      <section id="intro" class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">DEVELOPER GLOSSARY · 001</p>
          <h1 id="page-title">낯선 개발어를<br /><em>내 언어로.</em></h1>
        </div>
        <div class="intro-copy">
          <p>정의만 외우지 않습니다. 어디서 쓰고, 실제로 어떻게 움직이는지까지 한 장에 기록합니다.</p>
          <dl class="stats" aria-label="용어 노트 통계">
            <div><dt id="term-count">—</dt><dd>정리된 용어</dd></div>
            <div><dt id="mention-count">—</dt><dd>누적 등장</dd></div>
          </dl>
        </div>
      </section>

      <section id="catalog" class="catalog" aria-labelledby="catalog-title">
        <div class="section-heading">
          <h2 id="catalog-title">용어 노트</h2>
          <p>최근 다시 만난 용어부터 정렬됩니다.</p>
        </div>
        <div id="term-list" class="term-list" aria-live="polite">
          <p class="loading">용어를 꺼내고 있습니다…</p>
        </div>
      </section>

      <section id="detail" class="detail" aria-live="polite" hidden></section>
    </main>

    <footer>
      <span>계속 쌓이는 개발 언어 아카이브</span>
      <span>SQLite · Readable by everyone</span>
    </footer>
  </body>
</html>
